<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .box {
            display: grid;
            max-width: 1000px;
            margin: 15px auto;
            grid-template-columns: repeat(3, 1fr);
            background-color: aqua;
            gap: 10px;
        }
        /* .box div[class*=item]  */
        
        .box div {
            background-color: pink;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .box .item1 {
            grid-row: 1 / span 2;
            /* height: auto; */
        }
        
        .item4 {
            grid-column: 2 / span 2;
        }
        
        .box img {
            vertical-align: middle;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 保持图片宽高比并填充容器 */
        }
    </style>

</head>

<body>
    <div class="box">
        <div class="item1"><img src="../素材/rukawa/rukawa 1.jpg" alt=""></div>
        <div class="item2"><img src="../素材/rukawa/rukawa 2.jpg" alt=""></div>
        <div class="item3"><img src="../素材/rukawa/rukawa 3.jpg" alt=""></div>
        <div class="item4"><img src="../素材/rukawa/sd (1).jpg" alt=""></div>
        <div class="item5"><img src="../素材/rukawa/rukawa 4.jpg" alt=""></div>
        <div class="item6"><img src="../素材/rukawa/sd (11).jpg" alt=""></div>
        <div class="item7"><img src="../素材/rukawa/sd (14).jpg" alt=""></div>
    </div>
</body>

</html>

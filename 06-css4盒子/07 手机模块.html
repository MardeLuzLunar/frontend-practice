<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 1226px;
            height: 615px;
            background-color: skyblue;
            margin: auto;
            display: flex;
            gap: 14px;
        }

        .left {
            width: 234px;
            height: 615px;
            background-color: rgb(115, 172, 127);
        }

        .right {
            flex: 1;
            /* 让.right自动适应剩余空间，不挤压.left */
            height: 615px;
            background-color: skyblue;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;

        }

        .right>div {
            width: 234px;
            height: 300px;
            background-color: pink;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="left"></div>
        <div class="right">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
        </div>
    </div>
</body>

</html>

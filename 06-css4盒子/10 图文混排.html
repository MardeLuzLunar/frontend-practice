<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图文混排</title>
    <style>
        .article {
            width: 500px;
            padding: 20px;
        }
        
        .article img {
            float: left;
            margin-right: 20px;
            width: 200px;
            /* 调小一点给文字腾空间 */
        }
    </style>
</head>

<body>
    <div class="article">
        <img src="../素材/rukawa/kaede.png" alt="" />
        <p>
            鲜花盛开的季节，青春悄然流转。篮球场上，流川枫的眼神如风掠过，坚定冷静。他不是多言的人，却总能用行动征服全场。 每一次奔跑、每一次跳跃、每一次灌篮，都是对梦想的执着。比赛之外，他的背影孤独却令人安心。岁月的洪流中，总有一些瞬间会被铭记， 就像他在球场上的飒爽英姿让人热血沸腾。
        </p>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .clearfix:after {
            content: "";
            display: block;
            height: 0;
            clear: both;
            visibility: hidden;
        }

        .clearfix {
            *zoom: 1;
        }

        .box {
            width: 800px;
            border: 1px solid blue;
        }

        .first {
            float: left;
            width: 300px;
            height: 200px;
            background-color: aqua;
        }

        .second {
            float: left;
            width: 300px;
            height: 200px;
            background-color: brown;
        }

        .footer {
            height: 200px;
            background-color: black;
        }
    </style>
</head>

<body>
    <div class="box clearfix">
        <div class="first">aa</div>
        <div class="second">bb</div>
    </div>
    <div class="footer"></div>
</body>

</html>

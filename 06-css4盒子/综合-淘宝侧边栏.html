<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        ul {
            list-style: none;
        }
        
        a,
        a:hover {
            text-decoration: none;
        }
        
        .slidebox {
            background-color: rgb(247, 247, 247);
            width: 256px;
            border-radius: 12px;
            color: #1f1f1f;
            margin: 15px 0 0 10px;
        }
        
        .title {
            padding: 8px 0px 0 16px;
            font-size: 16px;
            font-weight: 600;
            line-height: 32px;
            color: #1f1f1f;
        }
        
        .title img {
            width: 36px;
            height: 20px;
            vertical-align: middle;
            /* 让图标在文本行中垂直居中显示 */
        }
        
        .menu {
            border-radius: 4px;
        }
        
        .menu li {
            height: 32px;
            line-height: 32px;
            margin: 0 8px;
            padding: 0 8px;
            transition: all 0.3s;
            color: #1f1f1f;
            font-size: 14px;
        }
        
        .slidebox iconfont {
            font-size: 14px;
        }
        
        .menu li:hover {
            background-color: #f0f0f0;
        }
        
        .menu li {
            cursor: default;
        }
        
        .menu li a {
            color: #1f1f1f;
            /* 设置链接默认颜色，与父元素一致 */
            cursor: pointer;
        }
        
        .menu li:nth-child(n+2) a:hover {
            color: #ff4400;
        }
        /* menu中第一个li的div */
        
        .menu li:first-child div,
        .menu li:first-child a {
            color: #ff4400;
        }
    </style>
</head>

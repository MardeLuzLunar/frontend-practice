<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        li {
            list-style: none;
            /* 去年列表的样式 */
        }

        .box {
            margin: auto;
            width: 248px;
            height: 163px;
            border: 1px solid #ccc;
        }

        .box h3 {
            height: 32px;
            border-bottom: 1px dotted #ccc;
            font-size: 14px;
            font-weight: 400;
            line-height: 32px;
            padding-left: 15px;
            /* 没设置宽度，所以padding不会撑大盒子 */
        }

        .box a {
            color: #666;
            font-size: 12px;
            text-decoration: none;
        }

        .box ul li {
            height: 28px;
            line-height: 28px;
            padding-left: 21px;
        }

        .box ul li:hover {
            text-decoration: underline;
        }

        .box ul {
            margin-top: 7px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h3>品优购快报</h3>
        <ul>
            <li><a href="#">【特惠】爆款耳机5折秒！</a></li>
            <li><a href="#">【特惠】爆款耳机5折秒！</a></li>
            <li><a href="#">【特惠】爆款耳机5折秒！</a></li>
            <li><a href="#">【特惠】爆款耳机5折秒！</a></li>
        </ul>
    </div>
</body>

</html>

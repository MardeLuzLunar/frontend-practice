<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css语法规范</title>
    <style>
        /* 选择器+{样式} */
        p {
            color: pink;
            font-size: 16px;
        }

        .a {
            color: rgb(0, 179, 255);
        }
    </style>
</head>

<body>
    <P>改个样式看看</P>
    <ul>
        <li>food</li>
        <li class="a">drink</li>
        <li>mash</li>
        <li>hamburger</li>
    </ul>
</body>

</html>

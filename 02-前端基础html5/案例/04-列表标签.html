<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>无序列表</h3>
    <h4>which manga do you like</h4>
    <ul>
        <!-- 只能嵌套li标签，没有前后顺序 -->
        <li>slam dunk</li>
        <!-- li里面可以放任何元素 -->
        <li>naruto</li>
        <li>suzume</li>
    </ul>

    <h3>有序列表</h3>
    <h4>排行榜</h4>
    <ol>
        <li>rukawa</li>
        <li>sendon</li>
        <li>sasuke</li>
    </ol>

    <h3>自定义列表</h3>
    <dl>
        <dt>一个名词</dt>
        <dd>名词解释</dd>
        <dd>名词解释</dd>
        <dd>名词解释</dd>
    </dl>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>边框</title>
    <style>
        .border {
            width: 300px;
            height: 200px;
            /* border-width: 5px;
            border-color: aquamarine;
            border-style: dashed; */
            border: 5px aquamarine dashed;
        }

        .top {
            width: 300px;
            height: 200px;
            border-top: 1px solid red;
            border-bottom: 1px solid burlywood;
        }

        .box {
            width: 200px;
            height: 200px;
            border: 2px solid blue;
            border-top: 2px solid red;
            /* 注意层叠性，单独改的写在后面 */
        }
    </style>
</head>

<body>
    <div class="border"></div>
    <br>
    <div class="top"></div>
    <br>
    <div class="box"></div>
</body>

</html>

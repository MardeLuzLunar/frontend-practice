<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 选择ol里的li */
        ol li {
            color: bisque;
        }

        /* ol li a 或者ol a */
        ol a {
            color: rgb(40, 26, 7);
        }

        ul li {
            color: blue;
        }

        .nav li {
            color: aquamarine;
        }
    </style>
</head>

<body>
    <ol>
        <li>fhvnn</li>
        <li>ffvvf</li>
        <li>ghjkl</li>
        <li><a href="#">试试</a></li>
    </ol>
    <ul>
        <li>dhfdjj</li>
        <li>dhfdjj</li>
        <li>dhfdjj</li>
    </ul>
    <ul class="nav">
        <li>dhfdjj</li>
        <li>dhfdjj</li>
        <li>dhfdjj</li>
    </ul>
</body>

</html>

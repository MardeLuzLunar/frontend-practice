<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ul1 li:first-child {
            color: red;
        }
        
        .ul1 li:last-child {
            color: blue;
        }
        
        .ul1 li:nth-child(3) {
            color: green;
        }
        
        .ul1 li:nth-child(2n) {
            color: pink;
        }
        
        .ul2 li:nth-child(odd) {
            color: skyblue;
        }
        
        .ul2 li:nth-child(even) {
            color: orange;
        }
    </style>
</head>

<body>
    <div class="ul1">
        <li>第1个li</li>
        <li>第2个li</li>
        <li>第3个li</li>
        <li>第4个li</li>
        <li>第5个li</li>
        <li>第6个li</li>
        <li>第7个li</li>
        <li>第8个li</li>
        <li>第9个li</li>
        <li>第10个li</li>
    </div>
    <div class="ul2">
        <li>第1个li</li>
        <li>第2个li</li>
        <li>第3个li</li>
        <li>第4个li</li>
        <li>第5个li</li>
        <li>第6个li</li>
        <li>第7个li</li>
        <li>第8个li</li>
        <li>第9个li</li>
        <li>第10个li</li>
    </div>
    <a href="../02-前端基础html5/案例/01-表格基本语法.html">表格实践</a>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 0;
            height: 0;
            border-top: 10px solid pink;
            border-left: 10px solid skyblue;
        }

        .box2 {
            width: 0;
            height: 0;
            border: 50px solid transparent;
            border-bottom-color: pink;
        }

        .jd {
            position: relative;
            width: 120px;
            height: 250px;
            background-color: pink;
        }

        .jd span {
            position: absolute;
            top: -10px;
            right: 50%;
            margin-right: -5px;
            width: 0;
            height: 0;
            border: 5px solid transparent;
            border-bottom-color: pink;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <div class="box2"></div>
    <br>
    <div class="jd">
        <span></span>
    </div>
</body>

</html>

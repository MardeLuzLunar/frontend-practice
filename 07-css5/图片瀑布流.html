            border: 1px solid #1f1881;
            transition: .3s;
        }
        
        .container .item a:hover {

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        
        .container .item a img {
            width: 100%;
            vertical-align: middle;
        }

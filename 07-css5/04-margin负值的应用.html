<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* margin负值的应用 */
        ul li {
            float: left;
            /* 去除list前面的小点 */
            list-style: none;
            position: relative;
            width: 150px;
            height: 200px;
            border: 1px solid red;
            margin-left: -1px;
        }

        /* ul li:hover {
            （如果没有有定位，则加相对定位（保留位置）
            position: relative; 
            
            border: 1px solid blue; 
        } */

        ul li:hover {
            /* 如果有定位，则加z-index）  */
            z-index: 1;
            border: 1px solid blue;

        }
    </style>
</head>

<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>
</body>

</html>
